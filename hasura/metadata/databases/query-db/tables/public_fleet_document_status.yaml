table:
  name: fleet_document_status
  schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - document_id
        - company_id
        - vehicle_id
        - trailer_id
        - driver_user_id
        - document_type_code
        - valid_to
        - status
        - days_left
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: transport_manager
    permission:
      columns:
        - document_id
        - company_id
        - vehicle_id
        - trailer_id
        - driver_user_id
        - document_type_code
        - valid_to
        - status
        - days_left
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: dispatcher
    permission:
      columns:
        - document_id
        - company_id
        - vehicle_id
        - trailer_id
        - driver_user_id
        - document_type_code
        - valid_to
        - status
        - days_left
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: accountant
    permission:
      columns:
        - document_id
        - company_id
        - vehicle_id
        - trailer_id
        - driver_user_id
        - document_type_code
        - valid_to
        - status
        - days_left
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
