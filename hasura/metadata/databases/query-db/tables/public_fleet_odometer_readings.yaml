table:
  name: fleet_odometer_readings
  schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - value_km
        - read_at
        - origin
        - is_anomaly
        - file_id
        - source
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: transport_manager
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - value_km
        - read_at
        - origin
        - is_anomaly
        - file_id
        - source
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: dispatcher
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - value_km
        - read_at
        - origin
        - is_anomaly
        - file_id
        - source
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: accountant
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - value_km
        - read_at
        - origin
        - is_anomaly
        - file_id
        - source
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
