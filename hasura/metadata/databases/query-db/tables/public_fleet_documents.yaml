        - reminders_muted
        - source
        - version
        - created_at
        - updated_at
        - is_deleted
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: driver
