        - series
        - issuer_name
        - issuer_country
        - country
        - issued_on
        - valid_from
        - valid_to
        - valid_to_km
        - categories
        - previous_document_id
        - superseded_at
        - is_current
        - reminders_muted
        - source
        - version
        - created_at
        - updated_at
