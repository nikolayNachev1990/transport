        - updated_at
        - is_deleted
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: dispatcher
    permission:
      columns:
        - id
        - company_id
        - document_type_code
        - vehicle_id
        - trailer_id
        - driver_user_id
