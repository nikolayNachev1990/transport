table:
  name: companies
  schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - id
        - name
        - eik
        - logo
        - vat_number
        - country
        - address
        - city
        - postal_code
        - mol
        - iban
        - bank_name
        - email
        - phone
        - payment_terms_days
        - is_customer
        - is_tenant
        - is_active
        - subscription_status
        - subscription_plan
        - subscription_valid_until
        - vat_checked_at
        - vat_valid
        - created_at
        - updated_at
      filter: {}
      limit: 1000
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - name
        - eik
        - logo
        - vat_number
        - country
        - address
        - city
        - postal_code
        - mol
        - iban
        - bank_name
        - email
        - phone
        - payment_terms_days
        - is_customer
        - is_tenant
        - is_active
        - subscription_status
        - subscription_plan
        - subscription_valid_until
        - vat_checked_at
        - vat_valid
        - created_at
        - updated_at
      filter: {}
      limit: 1000
      allow_aggregations: true
