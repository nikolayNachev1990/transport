table:
  name: fleet_equipment_items
  schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - trailer_id
        - item_type
        - quantity
        - serial
        - valid_to
        - notes
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: transport_manager
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - trailer_id
        - item_type
        - quantity
        - serial
        - valid_to
        - notes
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: dispatcher
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - trailer_id
        - item_type
        - quantity
        - serial
        - valid_to
        - notes
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: accountant
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - trailer_id
        - item_type
        - quantity
        - serial
        - valid_to
        - notes
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
