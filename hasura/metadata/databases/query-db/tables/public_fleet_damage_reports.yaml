      columns:
        - id
        - company_id
        - vehicle_id
        - trailer_id
        - driver_user_id
        - kind
        - occurred_at
        - location_text
        - lat
        - lng
        - description
        - third_party_involved
        - police_report_number
        - european_accident_statement
