table:
  name: users
  schema: public
select_permissions:
  - role: moderator
    permission:
      columns:
        - id
        - name
        - email
        - mobile_number
        - mobile_number_verified
        - active
        - avatar
        - role
        - country
        - language
        - platform
        - community_subscription
        - created_at
        - updated_at
      filter: {}
      limit: 1000
      allow_aggregations: true
  - role: user
    permission:
      columns:
        - id
        - name
        - email
        - mobile_number
        - mobile_number_verified
        - active
        - avatar
        - role
        - country
        - language
        - platform
        - community_subscription
        - created_at
        - updated_at
      filter: {}
      limit: 1000
      allow_aggregations: true
