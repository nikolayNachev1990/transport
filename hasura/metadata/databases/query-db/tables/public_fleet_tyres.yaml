table:
  name: fleet_tyres
  schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - company_id
        - serial
        - brand
        - model
        - size
        - dot_code
        - season
        - axle_type
        - status
        - mounted_vehicle_id
        - mounted_trailer_id
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: transport_manager
    permission:
      columns:
        - id
        - company_id
        - serial
        - brand
        - model
        - size
        - dot_code
        - season
        - axle_type
        - status
        - mounted_vehicle_id
        - mounted_trailer_id
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: dispatcher
    permission:
      columns:
        - id
        - company_id
        - serial
        - brand
        - model
        - size
        - dot_code
        - season
        - axle_type
        - status
        - mounted_vehicle_id
        - mounted_trailer_id
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: accountant
    permission:
      columns:
        - id
        - company_id
        - serial
        - brand
        - model
        - size
        - dot_code
        - season
        - axle_type
        - status
        - mounted_vehicle_id
        - mounted_trailer_id
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
