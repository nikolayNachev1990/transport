table:
  name: fleet_vehicle_drivers
  schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - driver_user_id
        - role
        - assigned_at
        - unassigned_at
        - note
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: transport_manager
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - driver_user_id
        - role
        - assigned_at
        - unassigned_at
        - note
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: dispatcher
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - driver_user_id
        - role
        - assigned_at
        - unassigned_at
        - note
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: accountant
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - driver_user_id
        - role
        - assigned_at
        - unassigned_at
        - note
        - version
        - synced_at
      filter:
        company_id:
          _eq: X-Hasura-Company-Id
      limit: 1000
      allow_aggregations: true
  - role: driver
    permission:
      columns:
        - id
        - company_id
        - vehicle_id
        - driver_user_id
        - role
        - assigned_at
        - unassigned_at
        - note
        - version
        - synced_at
      filter:
        driver_user_id:
          _eq: X-Hasura-User-Id
      limit: 1000
      allow_aggregations: false
