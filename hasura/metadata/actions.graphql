scalar json

# Every current auth-service REST handler responds `res.jsonOk(data)` on
# success -> `{ success: true, data: <whatever> }` (see
# core/src/server/index.mts's jsonOk) and a non-2xx status + `{ success:
# false, message, extensions }` on failure (jsonError) — Hasura surfaces
# that failure case as a GraphQL error automatically from message/
# extensions, so only the success shape needs a declared Output type here.
type Output {
  success: Boolean!
  data: json
}

type LoginData {
  access_token: String!
  refresh_token: String!
}

type LoginOutput {
  success: Boolean!
  data: LoginData
}

type RefreshData {
  access_token: String!
  access_token_created_at: String
  refresh_token: String!
}

type RefreshOutput {
  success: Boolean!
  data: RefreshData
}

