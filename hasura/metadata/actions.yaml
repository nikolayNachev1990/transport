        method: POST
        query_params: {}
        template_engine: Kriti
        version: 2
    permissions:
      - role: admin
      - role: moderator
      - role: user
    comment: >-
      Route is gated by passport.authenticate("bearer") in code, not
      checkAuth — same effect (requires a valid bearer token).

