      forward_client_headers: true
      headers:
        - name: content-type
          value: application/json
      timeout: 60
      request_transform:
        method: POST
        query_params: {}
        template_engine: Kriti
        version: 2
    permissions:
      - role: admin
    comment: >-
      Dev-only debug endpoint — the route itself only works when
      appConfig.isDevelopment is true and additionally checks
      req.hasuraUser.role === "admin"; this permission block mirrors that.

  - name: auth_login
    definition:
      kind: synchronous
      handler: http://auth-service/api/login
      forward_client_headers: true
      headers:
        - name: content-type
          value: application/json
      timeout: 60
      # No body transform needed — Hasura's default action webhook payload
      # is already `{"input": {...fields}}`, which is exactly what
      # core's validateBody middleware reads (req.body?.input ?? req.body).
      # An explicit Kriti body transform here (as the old reference did)
      # broke on the optional sms_code field when omitted — dropped rather
      # than patched, since it was redundant to begin with.
      request_transform:
        method: POST
        query_params: {}
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
    comment: auth_login

  - name: auth_login_cookie
    definition:
      kind: synchronous
      handler: http://auth-service/api/login/cookie
      forward_client_headers: true
      headers:
        - name: content-type
          value: application/json
      timeout: 60
      # Same reasoning as auth_login above — default action payload
      # passthrough already matches what the route expects.
      request_transform:
        method: POST
        query_params: {}
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
    comment: auth_login_cookie

  - name: auth_logout
