  #     LOGGER_SLACK_CHANNEL: ${LOGGER_SLACK_CHANNEL}
  #     LOGGER_SLACK_TOKEN: ${LOGGER_SLACK_TOKEN}

  # redis :::::::::::::::::::::::::::::::::::::::::::::::::::
  redis:
    container_name: redis
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: always
    networks:
      - ${NETWORK_MAIN_NAME}
    expose:
      - 6379
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - cache:/data

  # kafka 1 :::::::::::::::::::::::::::::::::::::::::::::::::::
  kafka-1:
    container_name: kafka-1
    image: apache/kafka:4.1.0
    user: "0:0"
    hostname: ${KAFKA_1_HOST}
    expose:
      - 9092
      - 9093
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${KAFKA_RAM_MAX}
        reservations:
          memory: ${KAFKA_RAM_RESERVED}
    volumes:
      - kafka_1_data:/bitnami/kafka
    networks:
      - ${NETWORK_MAIN_NAME}
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_NODE_ID: ${KAFKA_1_CFG_NODE_ID}
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: ${KAFKA_1_CFG_LISTENERS} # PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_1_CFG_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /bitnami/kafka
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "10"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "100"
      KAFKA_HEAP_OPTS: "-Xmx1024M -Xms128M"

  # kafka 2 :::::::::::::::::::::::::::::::::::::::::::::::::::
  kafka-2:
    container_name: kafka-2
    image: apache/kafka:4.1.0
    user: "0:0"
    hostname: ${KAFKA_2_HOST}
    expose:
      - 9092
      - 9093
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-2:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${KAFKA_RAM_MAX}
        reservations:
          memory: ${KAFKA_RAM_RESERVED}
    volumes:
      - kafka_2_data:/bitnami/kafka
    networks:
      - ${NETWORK_MAIN_NAME}
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_NODE_ID: ${KAFKA_2_CFG_NODE_ID}
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: ${KAFKA_2_CFG_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_2_CFG_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /bitnami/kafka
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "10"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "100"
      KAFKA_HEAP_OPTS: "-Xmx1024M -Xms128M"

  # webserver :::::::::::::::::::::::::::::::::::::::::::::::::::
