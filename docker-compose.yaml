  # minio: local stand-in for Cloudflare R2 (upload-service's S3-compatible
  # storage in production) — same S3 API, so @transport/core/s3 doesn't
  # need a second implementation. ::::::::::::::::::::::::::::::::::::::::
  minio:
    container_name: minio
    image: minio/minio
    # Published to the host (not just `expose`), unlike every other
    # backend service here: presigned URLs upload-service hands out are
    # meant to be used directly by whatever holds them (a browser, curl,
    # this repo's tester), not proxied back through upload-service itself
    # — same as R2 in production, which is directly internet-reachable.
    ports:
      - "${MINIO_API_PORTS}:9000"
      - "${MINIO_CONSOLE_PORTS}:9001"
    healthcheck:
      test: "exit 0"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: ${MINIO_RAM_MAX}
        reservations:
          memory: ${MINIO_RAM_RESERVED}
    networks:
      - ${NETWORK_MAIN_NAME}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_S3_END_POINT_IN_DOCKER: ${MINIO_S3_END_POINT_IN_DOCKER}
      MINIO_SERVER_URL: ${MINIO_S3_END_POINT_IN_DOCKER}
    command: ${MINIO_DOCKER_COMMAND}

  # minio setup: creates the bucket upload-service writes to, once — an
  # actual S3/R2 bucket in production is provisioned by hand, not by this.
  minio-setup:
    container_name: minio-setup
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - ${NETWORK_MAIN_NAME}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio ${MINIO_S3_END_POINT_IN_DOCKER} ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME};
      exit 0;
      "

networks:
  transport:
    driver: bridge

volumes:
  auth-db-data:
    driver: local
  cache:
