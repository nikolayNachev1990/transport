# Local development only — docker-compose.yml alone is the production
# shape (no host ports on anything but nginx). Compose merges this file
# in automatically when present; it's what `make up` runs by default.
services:
  # Distinct host ports per container — plain 5432 would collide 11 ways
  # otherwise. Range chosen to not collide with
  # packages/tms-core/docker-compose.test.yml's own port bindings either.
  auth-db:
    ports: ["5441:5432"]
  fleet-db:
    ports: ["5442:5432"]
  order-db:
    ports: ["5443:5432"]
  billing-db:
    ports: ["5444:5432"]
  files-db:
    ports: ["5445:5432"]
  track-db:
    ports: ["5446:5432"]
  routing-db:
    ports: ["5447:5432"]
  notify-db:
    ports: ["5448:5432"]
  ai-db:
    ports: ["5449:5432"]
  query-db:
    ports: ["5450:5432"]
  hasura-metadata-db:
    ports: ["5451:5432"]

  redis:
    ports:
      - "6379:6379"

  redpanda:
    ports:
      - "9092:9092"
      - "9644:9644"
    # Note: --advertise-kafka-addr is still `redpanda:9092` (baked into
    # docker-compose.yml's command) because every consumer of this in
    # dev is itself a container on this network. A bare-host Kafka client
    # (e.g. `rpk` run from your laptop, not from a container) won't be
    # able to produce/consume through this published port — that's what
    # packages/tms-core/docker-compose.test.yml is for, with its own
    # localhost-advertised listener.

  minio:
    ports:
      - "9000:9000"

  hasura:
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"

  nginx:
    # Bind-mount over what the image COPYs in, so editing these files
    # takes effect on `make nginx-reload` without a rebuild.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
