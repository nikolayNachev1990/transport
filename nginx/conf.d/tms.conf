server {
  listen 80;

  # nginx's own liveness probe — never proxied, doesn't touch Hasura.
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Never reachable from outside, through any route — including through
  # Hasura. tms-core/http's internal snapshot endpoints (stage 5) are
  # only for other services on the internal network to call directly,
  # never through this gateway.
  location /internal/ {
    return 404;
  }

  # Hasura is the single public gateway. Reads are plain GraphQL queries
  # over query_db; writes go through Hasura Actions, which call back into
  # the writing service's own REST endpoints (stage 5) internally — the
  # REST layer itself is unchanged, only who's allowed to reach it
  # directly from outside changed. No per-service URL prefix exists here
  # anymore for that reason: there's nothing left for nginx to route by
  # service, since the client only ever talks to Hasura.
  location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://hasura:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Explicit routes for webhooks from external systems go here, added
  # when a real one exists — none right now.
}
