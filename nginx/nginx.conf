worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # No unlimited body size (the old reference config's
  # `client_max_body_size 0` was a real footgun — an explicit, finite
  # default instead). GraphQL requests through Hasura are small; file
  # uploads never come through nginx at all (direct signed URLs to R2 —
  # tms-core/storage).
  client_max_body_size 1m;

  # A single coarse flood guard for the whole gateway. There's no
  # per-flow breakdown (e.g. a stricter limit on login) at this layer
  # anymore: every request funnels through the one Hasura endpoint, so
  # nginx can't distinguish a login mutation from any other GraphQL
  # operation without inspecting the request body. Precise per-flow
  # throttling (e.g. failed login attempts) belongs inside the service
  # that handles it (a Redis-backed counter in auth-service), not here.
  limit_req_status 429;
  limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

  include /etc/nginx/conf.d/*.conf;
}
