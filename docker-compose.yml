services:
  # One Postgres container per service database — not a shared instance.
  # Failure isolation: a crash, upgrade, or restore of one only ever
  # affects that one service, never the rest of the system. Each
  # container's POSTGRES_USER is that service's own login role, and
  # that's also the only login role in the instance (mirrors the
  # fleet_service -> auth_db isolation proven earlier, just structurally
  # stronger now: there is no second database in the instance to reach
  # even if a role/password leaked). deploy.resources.limits is honored
  # by plain `docker compose up` (verified for real — not swarm-only).

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_db
    expose: ["5432"]
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  fleet-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet_service
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD}
      POSTGRES_DB: fleet_db
    expose: ["5432"]
    volumes:
      - fleet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: order_db
    expose: ["5432"]
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing_service
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD}
      POSTGRES_DB: billing_db
    expose: ["5432"]
    volumes:
      - billing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  files-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: files_service
      POSTGRES_PASSWORD: ${FILES_DB_PASSWORD}
      POSTGRES_DB: files_db
    expose: ["5432"]
    volumes:
      - files_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U files_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Higher limits than the other business DBs — GPS point ingestion from
  # every truck in a fleet is a steadier write load than the rest.
  track-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: track_service
      POSTGRES_PASSWORD: ${TRACK_DB_PASSWORD}
      POSTGRES_DB: track_db
    expose: ["5432"]
    volumes:
      - track_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U track_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  routing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: routing_service
      POSTGRES_PASSWORD: ${ROUTING_DB_PASSWORD}
      POSTGRES_DB: routing_db
    expose: ["5432"]
    volumes:
      - routing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  notify-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify_service
      POSTGRES_PASSWORD: ${NOTIFY_DB_PASSWORD}
      POSTGRES_DB: notify_db
    expose: ["5432"]
    volumes:
      - notify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ai-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_service
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
      POSTGRES_DB: ai_db
    expose: ["5432"]
    volumes:
      - ai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # The only Postgres container with a second role: Hasura reads query_db
  # (the whole point of "Четене: само през Hasura над query_db") without
  # owning it. postgres/init/query-db/ adds that read-only-scoped `hasura`
  # role on top of query_service's own ownership — the same
  # dedicated-role-plus-revoked-PUBLIC pattern proven with
  # fleet_service -> auth_db, applied here because this is the one
  # genuine cross-service access case in the whole system.
  query-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: query_service
      POSTGRES_PASSWORD: ${QUERY_DB_PASSWORD}
      POSTGRES_DB: query_db
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD}
    expose: ["5432"]
    volumes:
      - query_db_data:/var/lib/postgresql/data
      - ./postgres/init/query-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U query_service"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Hasura's own operational state (hdb_catalog: tracked tables,
  # permissions, event/cron bookkeeping) — separate from query_db on
  # purpose. Owned outright by the `hasura` role, so Hasura never needs
  # CREATE privilege inside a database query-service owns.
  hasura-metadata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hasura
      POSTGRES_PASSWORD: ${HASURA_DB_PASSWORD}
      POSTGRES_DB: hasura_metadata_db
    expose: ["5432"]
    volumes:
      - hasura_metadata_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hasura"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  redis:
    image: redis:7-alpine
    # --appendonly yes: without it the mounted volume is decorative —
    # redis:alpine doesn't persist to disk by default, verified for real
    # (a bare container writes nothing under /data until this flag is
    # set), which is exactly the class of bug ("volume that doesn't
    # actually capture the service's data") to not repeat here.
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      # Other containers reach this over the internal Docker network by
      # service name, not localhost — this is the production compose,
      # nothing connects from the host.
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --check=false
      # Off by default per the old reference config's
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE: true — a producer typo would
      # silently create a garbage topic instead of failing loudly. Topics
      # are created deliberately, matching the schemas declared in
      # tms-contracts. Verified for real: Redpanda's own default for
      # this is `true`, same footgun under a different name; this flag
      # actually turns it off.
      - --set redpanda.auto_create_topics_enabled=false
    expose:
      - "9092"
      - "9644"
    volumes:
      # The real data directory, read out of redpanda's own default
      # config inside the image — not assumed. Mounting the wrong path
      # here is exactly the silent-data-loss bug flagged in the old
      # reference config (KAFKA_LOG_DIRS vs. a differently-pathed
      # volume).
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  hasura:
    image: hasura/graphql-engine:v2.44.0
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@hasura-metadata-db:5432/hasura_metadata_db
      HASURA_GRAPHQL_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@query-db:5432/query_db
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      # No metadata, no tracked tables, no permissions, no Actions yet —
      # stage 22. This stage only proves the skeleton connects and comes
      # up healthy.
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
    expose:
      - "8080"
    depends_on:
      hasura-metadata-db:
        condition: service_healthy
      query-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      hasura:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  auth_db_data:
  fleet_db_data:
  order_db_data:
  billing_db_data:
  files_db_data:
  track_db_data:
  routing_db_data:
  notify_db_data:
  ai_db_data:
  query_db_data:
  hasura_metadata_db_data:
  redis_data:
  redpanda_data:
  minio_data:
