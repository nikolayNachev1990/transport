packages:
  - "packages/*"
  - "services/*"

overrides:
  "@typescript/old": npm:typescript@6.0.3

catalog:
  "@aws-sdk/client-s3": 3.1128.0
  "@aws-sdk/s3-request-presigner": 3.1128.0
  "@confluentinc/kafka-javascript": 1.10.0
  "@eslint/js": 10.0.1
  ajv: 8.20.0
  bullmq: 6.3.4
  "@fastify/swagger": 9.8.1
  "@fastify/swagger-ui": 6.1.1
  "@types/jsonwebtoken": 9.0.10
  "@types/node": 22.20.1
  "@types/pg": 8.23.1
  "@typescript/native": npm:typescript@7.0.2
  eslint: 10.10.0
  eslint-config-prettier: 10.1.8
  fastify: 5.12.3
  ioredis: 6.0.0
  jsonwebtoken: 9.0.3
  knex: 3.3.0
  pg: 8.23.0
  prettier: 3.9.6
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: 8.70.0
  pino: 10.3.1
  vitest: 5.0.0
  zod: 4.5.4

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
  - '@aws-sdk/client-s3@3.1128.0'
  - '@aws-sdk/s3-request-presigner@3.1128.0'

allowBuilds:
  # Confluent's official librdkafka bindings — postinstall fetches a
  # prebuilt native binary (falls back to compiling from source).
  '@confluentinc/kafka-javascript': true
  # BullMQ's msgpack serializer — prebuilt native speedup, pure-JS fallback
  # if the build is skipped, so this is a performance opt-in, not a hard
  # requirement.
  msgpackr-extract: true
